# 复制为 config/settings.yaml 后填写。不要把 settings.yaml 提交到仓库。
# 栖语 - 运行时设置配置
# 修改后调用 POST /v1/settings/reload 热重载
# 或通过 WebUI 设置页面修改

version: "1.0"

# ============ 当前激活角色 ============
character:
  default: ""  # 默认角色 ID；空表示全新安装无角色
  # 用户级角色覆盖（会自动写入）
  user_overrides: {}

# ============ 全局 LLM 参数 ============
llm:
  base_url: "http://127.0.0.1:8080/v1"
  api_key: ""
  model: "your-model-name"
  max_tokens: 4096
  # Temperature 全局默认值（角色推荐值优先）
  default_temperature: 0.7

# ============ Letta 配置 ============
letta:
  base_url: "http://127.0.0.1:8283"
  admin_token: ""
  context_window: 8192

# ============ Qdrant 配置 ============
qdrant:
  host: "127.0.0.1"
  port: 6333
  collections:
    memory: "companion_memory"
    knowledge: "companion_knowledge"

# ============ Embedding 配置 ============
embedding:
  model: "BAAI/bge-small-zh-v1.5"
  device: "cpu"
  dimension: 512

# ============ RAG 配置 ============
rag:
  watch_dir: "./data/uploads"
  chunk_size: 512
  chunk_overlap: 128
  scan_interval: 60
  # 自动索引开关
  auto_index: true
  # 支持的文件格式
  supported_formats: [".txt", ".md", ".pdf", ".docx", ".doc"]

# ============ 微信配置 ============
wechat:
  enabled: false
  bot_name: "栖语"
  gateway_url: "http://127.0.0.1:8000"

# ============ 网关配置 ============
gateway:
  host: "0.0.0.0"
  port: 8000
  api_key: "ai-companion-key-change-me"
  # 流式响应分块大小（句子/字符）
  stream_chunk_mode: "sentence"  # sentence | char

# ============ 诊断修复配置 ============
diagnose:
  # 自动修复尝试次数
  auto_fix_retries: 3
  # 服务健康检查间隔（秒）
  health_check_interval: 30
  # 超时时长（秒）
  timeout: 120
